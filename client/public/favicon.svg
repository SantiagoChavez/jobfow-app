<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgFavicon" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0E1A38"/>
      <stop offset="60%" stop-color="#060C1B"/>
      <stop offset="100%" stop-color="#02050E"/>
    </radialGradient>
    <radialGradient id="sweepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060C1B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Navy Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgFavicon)" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Anillos concéntricos Cyber Cyan -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.5"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.75"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-opacity="0.95"/>

  <!-- Retícula guía -->
  <line x1="64" y1="19" x2="64" y2="109" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.4"/>
  <line x1="19" y1="64" x2="109" y2="64" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.4"/>

  <!-- Haz de barrido angular -->
  <path d="M 64 64 L 64 19 A 45 45 0 0 1 106 50 Z" fill="url(#sweepGlow)"/>

  <!-- Aguja de detección -->
  <line x1="64" y1="64" x2="102" y2="40" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="100" y2="41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Núcleo central -->
  <circle cx="64" cy="64" r="7" fill="#00E5FF" fill-opacity="0.4"/>
  <circle cx="64" cy="64" r="4" fill="#00E5FF"/>
  <circle cx="64" cy="64" r="2" fill="#FFFFFF"/>

  <!-- Punto de detección de vacante / Ping activo -->
  <circle cx="89" cy="38" r="7" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="89" cy="38" r="3.5" fill="#67E8F9"/>
  <circle cx="89" cy="38" r="1.8" fill="#FFFFFF"/>
</svg>