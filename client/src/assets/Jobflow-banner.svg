<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgVibrantNavy" cx="25%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="40%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0B1329"/>
    </radialGradient>

    <linearGradient id="goldUltraCrisp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="540" height="220" rx="20" fill="url(#bgVibrantNavy)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ISOTIPO RADAR -->
  <g transform="translate(65, 55)">
    <circle cx="55" cy="55" r="52" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="55" cy="55" r="36" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="55" cy="55" r="20" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="55" y1="3" x2="55" y2="107" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.5"/>
    <line x1="3" y1="55" x2="107" y2="55" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.5"/>
    <path d="M 55 55 L 55 3 A 52 52 0 0 1 107 55 Z" fill="url(#radarSweep)"/>
    <line x1="55" y1="55" x2="107" y2="55" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="105" y2="55" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <circle cx="55" cy="55" r="6" fill="#FACC15" fill-opacity="0.3"/>
    <circle cx="55" cy="55" r="3.5" fill="#FFFFFF"/>
    <circle cx="85" cy="28" r="10" fill="none" stroke="#FDE047" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="85" cy="28" r="5.5" fill="none" stroke="#FDE047" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="85" cy="28" r="3" fill="#FFFFFF"/>
    <circle cx="34" cy="76" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- TIPOGRAFÍA JOBFLOW -->
  <g transform="translate(210, 85)">
    <text x="0" y="33" fill="#030712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" opacity="0.6">Job<tspan>Flow</tspan></text>
    <text x="0" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Job<tspan fill="url(#goldUltraCrisp)">Flow</tspan></text>
    <text x="2" y="58" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5">RADAR &amp; CAREER TRACKER</text>
  </g>
</svg>
